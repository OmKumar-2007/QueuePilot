<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QueuePilot</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6fed'/%3E%3Cpath d='M9 11h14M9 16h10M9 21h6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="#/dashboard"><span class="brand-mark" aria-hidden="true"></span>QueuePilot</a>
        <nav id="nav" aria-label="Main">
            <a href="#/dashboard" data-route="dashboard">Live</a>
            <a href="#/jobs" data-route="jobs">Jobs</a>
            <a href="#/submit" data-route="submit">Submit</a>
            <a href="#/workflows" data-route="workflows">Workflows</a>
            <a href="#/scheduler" data-route="scheduler">Scheduler</a>
            <a href="#/tasks" data-route="tasks">Tasks</a>
            <a href="#/benchmarks" data-route="benchmarks">Benchmarks</a>
        </nav>
        <span id="health" class="health" title="Coordinator status"><span class="dot"></span></span>
    </div>
</header>
<main id="view" tabindex="-1"></main>
<div id="drawer" class="drawer" hidden>
    <div class="drawer-backdrop" data-close></div>
    <section class="drawer-panel" role="dialog" aria-modal="true">
        <button class="icon-button drawer-close" data-close aria-label="Close">✕</button>
        <div id="drawer-content"></div>
    </section>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
