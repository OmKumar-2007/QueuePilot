<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QueuePilot</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Cpath d='M9 11h14M9 16h10M9 21h6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <div>
                <strong>QueuePilot</strong>
                <small>Job scheduling platform</small>
            </div>
        </div>
        <nav id="nav" aria-label="Main">
            <a href="#/overview" data-route="overview">Overview</a>
            <a href="#/submit" data-route="submit">Submit job</a>
            <a href="#/jobs" data-route="jobs">Jobs</a>
            <a href="#/workflows" data-route="workflows">Workflows</a>
            <a href="#/tasks" data-route="tasks">Task registry</a>
            <a href="#/scheduler" data-route="scheduler">Scheduler</a>
            <a href="#/workers" data-route="workers">Workers</a>
            <a href="#/benchmarks" data-route="benchmarks">Benchmarks</a>
        </nav>
        <div class="sidebar-foot">
            <div id="health" class="health"><span class="dot"></span><span>Connecting…</span></div>
        </div>
    </aside>
    <div class="main">
        <header class="topbar">
            <button class="icon-button menu-toggle" id="menu-toggle" aria-label="Toggle navigation">☰</button>
            <h1 id="page-title">Overview</h1>
            <div class="topbar-right">
                <span class="chip" id="policy-chip" title="Active scheduling policy">—</span>
                <button class="button ghost" id="admin-button">Admin login</button>
            </div>
        </header>
        <main id="view" tabindex="-1"></main>
    </div>
</div>
<div id="drawer" class="drawer" hidden>
    <div class="drawer-backdrop" data-close></div>
    <section class="drawer-panel" role="dialog" aria-modal="true">
        <button class="icon-button drawer-close" data-close aria-label="Close">✕</button>
        <div id="drawer-content"></div>
    </section>
</div>
<div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <section class="modal-panel" role="dialog" aria-modal="true">
        <div id="modal-content"></div>
    </section>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
