server.port=8080
spring.application.name=QueuePilot

# Database Configuration (H2 embedded with persistent file mode for instant demo; can switch to PostgreSQL)
spring.datasource.url=jdbc:h2:mem:queuepilotdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# QueuePilot Defaults
queuepilot.scheduler.default-policy=FCFS
queuepilot.scheduler.aging-interval-seconds=3
queuepilot.scheduler.aging-increment=1

# Worker & Watchdog Configuration
queuepilot.workers.default-count=4
queuepilot.workers.heartbeat-interval-ms=1000
queuepilot.workers.lease-duration-ms=4000
queuepilot.recovery.watchdog-interval-ms=1000
queuepilot.recovery.heartbeat-timeout-ms=4000

